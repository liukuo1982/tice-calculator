<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>体测得分计算器（四/六/八年级）</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box}
  body{font-family:-apple-system,"Microsoft YaHei",sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:16px}
  .container{max-width:680px;margin:0 auto}
  .card{background:#fff;border-radius:16px;padding:24px 20px;margin-bottom:16px;box-shadow:0 8px 32px rgba(0,0,0,.15)}
  h1{text-align:center;color:#fff;font-size:22px;margin-bottom:4px;text-shadow:0 2px 8px rgba(0,0,0,.3)}
  .subtitle{text-align:center;color:rgba(255,255,255,.85);font-size:12px;margin-bottom:16px}
  .toggle-row{display:flex;gap:8px;margin-bottom:16px}
  .toggle-row button{flex:1;padding:10px 4px;border:2px solid #e0e0e0;border-radius:10px;font-size:14px;font-weight:600;cursor:pointer;background:#fff;transition:all .2s}
  .toggle-row button.active{border-color:#764ba2;background:#f3e8ff;color:#764ba2}
  .input-group{margin-bottom:12px}
  .input-group label{display:flex;justify-content:space-between;align-items:center;font-size:13px;color:#555;margin-bottom:4px;font-weight:600}
  .input-group label .unit{color:#999;font-weight:400;font-size:11px}
  .input-group input{width:100%;padding:9px 12px;border:2px solid #e0e0e0;border-radius:8px;font-size:16px}
  .input-group input:focus{outline:none;border-color:#764ba2}
  .input-row{display:flex;gap:10px}
  .input-row .input-group{flex:1}
  .time-row{display:flex;gap:10px;align-items:flex-end}
  .time-row .input-group{flex:1}
  .btn-calc{width:100%;padding:14px;background:linear-gradient(135deg,#667eea,#764ba2);color:#fff;border:none;border-radius:10px;font-size:18px;font-weight:700;cursor:pointer;transition:transform .15s;margin-top:8px}
  .btn-calc:hover{transform:translateY(-2px)}
  .result-card{display:none}
  .total-score{text-align:center;padding:12px 0}
  .total-score .score{font-size:44px;font-weight:800;color:#764ba2;line-height:1.2}
  .total-score .score120{font-size:18px;color:#999;font-weight:600}
  .total-score .grade{display:inline-block;padding:5px 18px;border-radius:20px;font-size:15px;font-weight:700;margin-top:6px}
  .grade-excellent{background:#e8f5e9;color:#2e7d32}
  .grade-good{background:#e3f2fd;color:#1565c0}
  .grade-pass{background:#fff9c4;color:#f57f17}
  .grade-fail{background:#ffebee;color:#c62828}
  .proc-box{text-align:center;margin:10px 0;padding:10px;background:#f3e8ff;border-radius:10px}
  .proc-box .label{font-size:12px;color:#764ba2;font-weight:600}
  .proc-box .val{font-size:28px;font-weight:800;color:#764ba2}
  .proc-box .desc{font-size:11px;color:#999}
  .detail-table{width:100%;border-collapse:collapse;margin-top:12px}
  .detail-table th,.detail-table td{padding:7px 10px;text-align:center;border-bottom:1px solid #f0f0f0;font-size:13px}
  .detail-table th{color:#999;font-weight:600;font-size:11px}
  .detail-table td.sc{font-weight:700;color:#764ba2}
  .note{font-size:11px;color:#aaa;margin-top:10px;line-height:1.6}
  .src{font-size:10px;color:#bbb;margin-top:6px;padding:6px;background:#f9f9f9;border-radius:6px;line-height:1.5}
  .fields{display:none}
  .fields.active{display:block}
</style>
</head>

<div class="container">
  <h1>🏃 体测得分计算器</h1>
  <p class="subtitle">北京市 ·《国家学生体质健康标准（2014年修订）》</p>
  <div class="card">
    <div class="toggle-row">
      <button class="active" onclick="setGrade('4')">四年级</button>
      <button onclick="setGrade('6')">六年级</button>
      <button onclick="setGrade('8')">八年级</button>
    </div>
    <div class="toggle-row">
      <button id="g-boy" class="active" onclick="setGender('boy')">👦 男生</button>
      <button id="g-girl" onclick="setGender('girl')">👧 女生</button>
    </div>
    <div class="input-row">
      <div class="input-group">
        <label>身高 <span class="unit">米</span></label>
        <input type="number" id="height" step="0.01" value="1.45">
      </div>
      <div class="input-group">
        <label>体重 <span class="unit">公斤</span></label>
        <input type="number" id="weight" step="0.1" value="38">
      </div>
    </div>
    <div class="input-group">
      <label>肺活量 <span class="unit">毫升</span></label>
      <input type="number" id="vl" value="2200">
    </div>
    <div class="input-group">
      <label>50米跑 <span class="unit">秒</span></label>
      <input type="number" id="run50" step="0.1" value="9.2">
    </div>
    <div class="input-group">
      <label>坐位体前屈 <span class="unit">厘米</span></label>
      <input type="number" id="sitReach" step="0.1" value="10.5">
    </div>
    <div class="fields" id="f-jump">
      <div class="input-group">
        <label>一分钟跳绳 <span class="unit">次</span></label>
        <input type="number" id="jump" value="145">
      </div>
    </div>
    <div class="fields" id="f-sitUp">
      <div class="input-group">
        <label>一分钟仰卧起坐 <span class="unit">次</span></label>
        <input type="number" id="sitUp" value="38">
      </div>
    </div>
    <div class="fields" id="f-run50x8">
      <div class="input-group">
        <label>50米×8往返跑 <span class="unit">输入格式：1分30秒 → 1和30</span></label>
        <div class="time-row">
          <div class="input-group"><label>分</label><input type="number" id="run50x8_m" value="1"></div>
          <div class="input-group"><label>秒</label><input type="number" id="run50x8_s" value="30"></div>
        </div>
      </div>
    </div>
    <div class="fields" id="f-longJump">
      <div class="input-group">
        <label>立定跳远 <span class="unit">厘米</span></label>
        <input type="number" id="longJump" value="200">
      </div>
    </div>
    <div class="fields" id="f-pullUp">
      <div class="input-group">
        <label id="pullUpLabel">引体向上 <span class="unit">次</span></label>
        <input type="number" id="pullUp" value="10">
      </div>
    </div>
    <div class="fields" id="f-runLong">
      <div class="input-group">
        <label id="runLongLabel">1000米跑 <span class="unit">输入格式：3分50秒 → 3和50</span></label>
        <div class="time-row">
          <div class="input-group"><label>分</label><input type="number" id="runLong_m" value="3"></div>
          <div class="input-group"><label>秒</label><input type="number" id="runLong_s" value="50"></div>
        </div>
      </div>
    </div>
    <button class="btn-calc" onclick="calculate()">开始计算</button>
  </div>
  <div class="card result-card" id="resultCard">
    <div class="total-score">
      <div class="score" id="totalScore">--</div>
      <div class="score120" id="total120"></div>
      <div class="grade" id="gradeBadge">--</div>
    </div>
    <div class="proc-box">
      <div class="label">北京中考体育过程性考核赋分</div>
      <div class="val" id="procScore">--</div>
      <div class="desc">满分10分</div>
    </div>
    <table class="detail-table">
      <thead><tr><th>项目</th><th>成绩</th><th>得分</th><th>权重</th><th>加权分</th></tr></thead>
      <tbody id="detailBody"></tbody>
    </table>
    <p class="note" id="noteText"></p>
    <div class="src">数据来源：首都教育发布的《国家学生体质健康标准（2014年修订）》评分表</div>
  </div>
</div>

  else if(grade==='6'){document.getElementById('f-jump').classList.add('active');document.getElementById('f-sitUp').classList.add('active');document.getElementById('f-run50x8').classList.add('active');}
  else{document.getElementById('f-longJump').classList.add('active');document.getElementById('f-pullUp').classList.add('active');document.getElementById('f-runLong').classList.add('active');
    if(gender==='boy'){document.getElementById('pullUpLabel').innerHTML='引体向上 <span class="unit">次</span>';document.getElementById('runLongLabel').innerHTML='1000米跑 <span class="unit">分+秒</span>';}
    else{document.getElementById('pullUpLabel').innerHTML='一分钟仰卧起坐 <span class="unit">次</span>';document.getElementById('runLongLabel').innerHTML='800米跑 <span class="unit">分+秒</span>';}
  }
}
showFields();

function getScore(val,table,isLow){
  if(isNaN(val))return null;
  for(var i=0;i<table.length;i++){
    if(isLow){if(val<=table[i][1])return table[i][0];}
    else{if(val>=table[i][1])return table[i][0];}
  }
  return 0;
}
function bmiScore(h,w){
  if(!h||!w)return null;
  var bmi=w/(h*h);
  var s=D.bmi[gender][grade];
  if(bmi>=s.normalLow&&bmi<=s.normalHigh)return 100;
  if(bmi<s.normalLow)return 80;
  if(bmi<=s.overHigh)return 80;
  return 60;
}
function calcJumpAdd(cnt){
  if(grade==='8')return 0;
  var base=D.jumpBase[gender][grade];
  if(cnt<=base)return 0;
  return Math.min(Math.floor((cnt-base)/2),20);
}
function getProc(t){
  if(t>=80)return 10;if(t>=75)return 8.5;if(t>=70)return 8;if(t>=65)return 7.5;if(t>=60)return 7;return 5.5;
}
function calculate(){
  var h=parseFloat(document.getElementById('height').value);
  var w=parseFloat(document.getElementById('weight').value);
  var g=gender;
  var S=D.scores[g];
  var W=D.weights[grade];
  var bmi=bmiScore(h,w);
  var bmiVal=h&&w?w/(h*h):null;
  var items=[];
  items.push({name:'BMI',raw:bmiVal?bmiVal.toFixed(1):'--',score:bmi,weight:W.bmi});
  items.push({name:'肺活量',raw:val('vl'),score:getScore(val('vl'),S.vl[grade],false),weight:W.vl});
  items.push({name:'50米跑',raw:val('run50'),score:getScore(val('run50'),S.run50[grade],true),weight:W.run50});
  items.push({name:'坐位体前屈',raw:val('sitReach'),score:getScore(val('sitReach'),S.sitReach[grade],false),weight:W.sitReach});

  var addStr='';
  if(grade==='4'||grade==='6'){
    var j=val('jump');
    var su=val('sitUp');
    items.push({name:'一分钟跳绳',raw:j,score:getScore(j,S.jump[grade],false),weight:W.jump});
    items.push({name:'一分钟仰卧起坐',raw:su,score:getScore(su,S.sitUp[grade],false),weight:W.sitUp});
    var ja=calcJumpAdd(j);
    if(ja>0)items.push({name:'跳绳附加分',raw:'+'+ja,score:ja,weight:0,bonus:true});
    addStr='跳绳附加分：每多跳2次加1分，最高20分';
  } else if(grade==='6'){
    // 50m×8 handled separately below
  }

  if(grade==='6'){
    var rm=parseInt(document.getElementById('run50x8_m').value)||0;
    var rs=parseInt(document.getElementById('run50x8_s').value)||0;
    var rsec=rm*60+rs;
    items.push({name:'50米×8往返跑',raw:rm+'\''+rs+'"',score:getScore(rsec,S.run50x8[grade],true),weight:W.run50x8});
  }

  if(grade==='8'){
    var lj=val('longJump');
    items.push({name:'立定跳远',raw:lj,score:getScore(lj,S.longJump[grade],false),weight:W.longJump});
    if(g==='boy'){
      var pu=val('pullUp');
      items.push({name:'引体向上',raw:pu,score:getScore(pu,S.pullUp[grade],false),weight:W.pullUp});
      var rm2=parseInt(document.getElementById('runLong_m').value)||0;
      var rs2=parseInt(document.getElementById('runLong_s').value)||0;
      var rsec2=rm2*60+rs2;
      items.push({name:'1000米跑',raw:rm2+'\''+rs2+'"',score:getScore(rsec2,S.run1000[grade],true),weight:W.run1000});
    }else{
      var su8=val('pullUp');
      items.push({name:'一分钟仰卧起坐',raw:su8,score:getScore(su8,S.sitUp[grade],false),weight:W.pullUp});
      var rm3=parseInt(document.getElementById('runLong_m').value)||0;
      var rs3=parseInt(document.getElementById('runLong_s').value)||0;
      var rsec3=rm3*60+rs3;
      items.push({name:'800米跑',raw:rm3+'\''+rs3+'"',score:getScore(rsec3,S.run800[grade],true),weight:W.run1000});
    }
    addStr='八年级加分项：引体向上/仰卧起坐（最高10分）+ 1000米/800米跑（最高10分）';
  }

  var total100=0,totalAdd=0,html='';
  for(var i=0;i<items.length;i++){
    var it=items[i];
    var s=it.score!==null?it.score:0;
    if(it.bonus){totalAdd+=s;}
    else{total100+=s*it.weight;}
    html+='<tr><td>'+it.name+'</td><td>'+it.raw+'</td><td class="sc">'+(it.score!==null?it.score:'--')+'</td><td>'+(it.bonus?'-':(it.weight*100)+'%')+'</td><td>'+(it.bonus?s:(s*it.weight).toFixed(1))+'</td></tr>';
  }
  var total120=total100+totalAdd;
  var proc=getProc(total100);
  document.getElementById('detailBody').innerHTML=html;
  document.getElementById('totalScore').textContent=total100.toFixed(1);
  document.getElementById('total120').textContent='含附加分：'+total120.toFixed(1)+' / 120分';
  document.getElementById('procScore').textContent=proc+' 分';
  var badge=document.getElementById('gradeBadge');
  if(total100>=80){badge.className='grade grade-excellent';badge.textContent='优秀 ⭐';}
  else if(total100>=75){badge.className='grade grade-good';badge.textContent='良好 👍';}
  else if(total100>=60){badge.className='grade grade-pass';badge.textContent='及格 ✅';}
  else{badge.className='grade grade-fail';badge.textContent='不及格 ❌';}
  var wStr=grade==='4'?'BMI15%·肺活量15%·50米20%·体前屈20%·跳绳20%·仰卧起坐10%':grade==='6'?'BMI15%·肺活量15%·50米20%·体前屈10%·跳绳10%·仰卧起坐20%·往返跑10%':'BMI15%·肺活量15%·50米20%·体前屈10%·跳远10%·引体/仰卧10%·长跑20%';
  document.getElementById('noteText').innerHTML='标准分满分100分+附加分。权重：'+wStr+'<br>等级：优秀≥80 · 良好75-79.9 · 及格60-74.9 · 不及格<60'+(addStr?'<br>'+addStr:'');
  document.getElementById('resultCard').style.display='block';
}
function val(id){return parseFloat(document.getElementById(id).value);}
</script>
